<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brickyard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.by{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.by.light,.by.auto{--bg:#F6F5F3;--surface:#FFFFFF;--sunken:#EFEEEB;--line:#E3E1DC;--line2:#CFCCC5;--ink:#121214;--ink2:#55534E;--ink3:#6A6862;--accent:#2F3BD0;--onaccent:#FFFFFF;--dot:#D9D6CF;--chk1:#E2E0DB;--chk2:#FFFFFF;--danger:#B42318;--pop:0 12px 32px -12px rgba(0,0,0,.28)}
.by.dark{--bg:#0E0E10;--surface:#17171A;--sunken:#0B0B0D;--line:#2A2A2F;--line2:#3B3B42;--ink:#F2F1EE;--ink2:#B6B4AE;--ink3:#8E8C86;--accent:#98A0FF;--onaccent:#0B0B1A;--dot:#26262B;--chk1:#2A2A2F;--chk2:#1B1B1F;--danger:#FF9C93;--pop:0 12px 32px -12px rgba(0,0,0,.8)}
@media (prefers-color-scheme: dark){.by.auto{--bg:#0E0E10;--surface:#17171A;--sunken:#0B0B0D;--line:#2A2A2F;--line2:#3B3B42;--ink:#F2F1EE;--ink2:#B6B4AE;--ink3:#8E8C86;--accent:#98A0FF;--onaccent:#0B0B1A;--dot:#26262B;--chk1:#2A2A2F;--chk2:#1B1B1F;--danger:#FF9C93;--pop:0 12px 32px -12px rgba(0,0,0,.8)}}
.by button,.by input{font-family:inherit}
.by button{cursor:pointer}
.by button:disabled{cursor:not-allowed}
.by .btn:hover,.by .tile:hover{border-color:var(--ink3)}
.by .pri:hover{opacity:.92}
.by .item:hover:not(:disabled){background:var(--sunken)}
.by .seg:hover:not(:disabled){color:var(--ink)}
.by .link:hover{text-decoration:none}
.by :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.by .shell-x{}
.by.shell{box-sizing:border-box;display:flex;flex-direction:column}
.by .wrap{width:100%;max-width:1360px;margin:0 auto;box-sizing:border-box;padding:24px clamp(16px,4vw,40px) 64px;display:flex;flex-direction:column;gap:24px}
.by .bar{flex:none;background:color-mix(in srgb,var(--bg) 97%,var(--ink) 3%);border-bottom:1px solid var(--line)}
.by .barIn{max-width:1600px;margin:0 auto;box-sizing:border-box;padding:12px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px}
.by .themeBtn{flex:none;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.by .nameIn{flex:1;min-width:0;height:56px;box-sizing:border-box;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:500 18px 'JetBrains Mono',ui-monospace,monospace}
.by .nameBtn{flex:none;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600}
.by .main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
.by .prev{flex:1 1 440px;max-width:440px;min-width:0;box-sizing:border-box;padding:20px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.by .styles{flex:999 1 560px;min-width:0;box-sizing:border-box;padding:24px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.by .vp{position:relative;margin-top:12px;aspect-ratio:1;box-sizing:border-box;overflow:hidden;container-type:inline-size;border-radius:8px;border:1px solid var(--line)}
.by .m16{margin-top:16px}.by .m20{margin-top:20px}
.by .colourBox{margin-top:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.by .tiles{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(max(128px,calc((100% - 52px) / 5)),1fr));gap:12px}
.by .tl{min-width:0;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding:10px 10px 12px;text-align:left;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.by .tile-sq{position:relative}
.by .varBox{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.by .vthumbs{margin-top:8px;display:grid;grid-template-columns:repeat(6,minmax(0,88px));gap:12px}
.by .chip{height:34px;padding:0 10px;border-radius:8px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600}
@media (min-width: 1000px){
.by.shell{height:max(100vh,640px);min-height:0 !important;overflow:hidden}
.by .barIn{padding:8px 32px}
.by .wrap{flex:1 1 0;min-height:0;max-height:1000px;max-width:1600px;padding:12px 32px 20px;gap:12px}
.by .nameIn,.by .nameBtn{height:36px}
.by .nameIn{font-size:15px;padding:0 12px}
.by .nameBtn{font-size:13px;padding:0 14px;gap:6px}
.by .themeBtn{width:32px;height:32px}
.by header svg{width:22px;height:22px}
.by .brand{font-size:20px !important}
.by .main{flex:1;min-height:0;flex-wrap:nowrap;align-items:stretch;gap:20px}
.by .prev{flex:none;max-width:none;width:clamp(380px,min(calc(100vh - 281px),46vw),640px);padding:12px;display:flex;flex-direction:column;gap:10px}
.by .m16,.by .m20{margin-top:0}
.by .vpWrap{flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center}
.by .vp{margin-top:0;width:min(100cqw,100cqh)}
.by .styles{flex:1 1 0;align-self:flex-start;padding:16px;display:flex;flex-direction:column}
.by .colourBox{margin-top:12px;padding-bottom:16px}
.by .tiles{flex:none;margin-top:12px;container-type:normal;grid-template-columns:repeat(auto-fill,minmax(80px,88px));grid-auto-rows:auto;gap:8px}
.by .tl{height:auto;gap:5px;padding:5px 5px 7px}
.by .tl .tn{font-size:12px}
.by .tl .tm{display:none}
.by .tl .bdg{top:3px !important;right:3px !important;height:15px !important;padding:0 4px !important;font-size:9px !important}
.by .tl .bdg svg{display:none}
.by .tile-img{flex:none;display:block}
.by .tile-sq{width:100%}
.by .varBox{margin-top:16px;padding-top:12px}
.by .vthumbs{grid-template-columns:repeat(6,minmax(0,48px));gap:8px}
.by .seg{height:32px !important;min-width:0 !important;font-size:13px !important}
.by .seg[aria-label]{width:32px !important;padding:0 !important}
.by .seg:not([aria-label]){padding:0 12px !important;min-width:44px !important}
.by .seg [aria-hidden]{width:15px !important;height:15px !important}
.by .ib{width:32px !important;height:32px !important}
.by .ib svg{width:16px;height:16px}
.by .chip{height:28px;font-size:12px;padding:0 8px}
.by .chip[aria-label]{width:28px !important}
.by .swb{width:28px !important;height:28px !important;padding:2px !important}
.by .swb svg{width:12px;height:12px}
.by .link{min-height:28px !important}
.by dl{font-size:13px !important;row-gap:3px !important}
.by .styles h2,.by .varBox h2{font-size:14px !important}
.by [role=menuitem]{height:34px !important;font-size:13px !important}
.by .colourBox{margin-top:10px;padding-bottom:12px}
.by .varBox{margin-top:12px;padding-top:10px}
.by .varBox > div:first-child{min-height:32px !important}

}
</style>
</helmet>
<div class="by {{appearanceCls}} shell" style="min-height: {{minH}}">
<div class="bar">
<div class="barIn">
<header style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true" style="flex: none; color: var(--ink)"><g fill="currentColor"><rect x="0" y="0" width="1" height="2"></rect><rect x="4" y="0" width="1" height="2"></rect><rect x="1" y="1" width="3" height="1"></rect><rect x="1" y="2" width="1" height="2"></rect><rect x="3" y="2" width="1" height="2"></rect><rect x="2" y="3" width="1" height="1"></rect><rect x="0" y="4" width="1" height="1"></rect><rect x="4" y="4" width="1" height="1"></rect></g></svg>
<h1 class="brand" style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Brickyard</h1>
</div>
</header>
<button type="button" class="btn themeBtn" aria-label="{{themeLabel}}" title="{{themeLabel}}" onClick="{{toggleTheme}}">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></sc-if>
<sc-if value="{{notDark}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
</button>
</div>
</div>

<div class="wrap">

<section aria-label="Name" style="flex: none; display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-size: 13px; font-weight: 600; color: var(--ink2)">Enter anything to see your avatar</label>
<div style="display: flex; gap: 12px">
<input id="name" class="nameIn" type="text" value="{{person}}" onChange="{{onName}}" placeholder="Username, name or any string" spellcheck="false" autocomplete="off">
<button type="button" class="btn nameBtn" onClick="{{shuffle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
Shuffle
</button>
</div>
</section>

<main class="main">

<section aria-label="Preview" class="prev">

<h2 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">Preview</h2>
<div onKeyDown="{{menuKey}}" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<div role="group" aria-label="Preview mode" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line)">
<button type="button" class="seg" aria-pressed="{{is2d}}" onClick="{{set2d}}" style="height: 40px; min-width: 56px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 600; {{seg2d}}">2D</button>
<button type="button" class="seg" aria-pressed="{{show3d}}" aria-describedby="note3d" disabled="{{no3d}}" onClick="{{set3d}}" style="height: 40px; min-width: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 14px; font-weight: 600; {{seg3d}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
3D
</button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="Background" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line)">
<sc-for list="{{bgs}}" as="g" hint-placeholder-count="3">
<button type="button" class="seg" aria-pressed="{{g.on}}" aria-label="{{g.label}} background" title="{{g.label}} background" onClick="{{g.pick}}" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; {{g.css}}">
<span aria-hidden="true" style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid var(--ink2); {{g.sw}}"></span>
</button>
</sc-for>
</div>
<button type="button" class="btn ib" onClick="{{copy}}" aria-label="Copy PNG" title="Copy PNG" style="flex: none; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
</button>
<div style="position: relative">
<button type="button" class="btn ib" aria-haspopup="menu" aria-expanded="{{menuOpen}}" aria-label="Download" title="Download" onClick="{{toggleMenu}}" style="flex: none; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Download options" style="position: absolute; z-index: 10; right: 0; top: calc(100% + 6px); width: 248px; box-sizing: border-box; padding: 6px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); box-shadow: var(--pop)">
<sc-for list="{{pngItems}}" as="m" hint-placeholder-count="3">
<button type="button" role="menuitem" class="item" onClick="{{closeMenu}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; text-align: left">
{{m.label}}
<span style="font: 400 12px 'JetBrains Mono', ui-monospace, monospace; color: var(--ink3)">{{m.dim}}</span>
</button>
</sc-for>
<div aria-hidden="true" style="height: 1px; margin: 6px 4px; background: var(--line)"></div>
<button type="button" role="menuitem" class="item" disabled="" aria-disabled="true" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 6px; background: transparent; color: var(--ink3); font-size: 14px; font-weight: 500; text-align: left">
Download as SVG
<span style="padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line2); font-size: 11px; font-weight: 600">Soon</span>
</button>
<button type="button" role="menuitem" class="item" disabled="" aria-disabled="true" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 6px; background: transparent; color: var(--ink3); font-size: 14px; font-weight: 500; text-align: left">
Download as STL
<span style="padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line2); font-size: 11px; font-weight: 600">Soon</span>
</button>
</div>
</sc-if>
</div>
</div>
</div>

<div class="vpWrap">
<div class="vp" onPointerDown="{{vp.down}}" onPointerMove="{{vp.move}}" onPointerUp="{{vp.up}}" onPointerCancel="{{vp.up}}" onWheel="{{vp.wheel}}" style="{{vp.css}}">
<sc-if value="{{show2d}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0 0 40px 0; display: grid; place-items: center">
<div role="img" aria-label="{{previewAlt}}" style="width: 72%; overflow: hidden; border-radius: 6px; {{vp.shadow}}">
<div style="display: grid; {{main.css}}">
<sc-for list="{{main.cells}}" as="cell" hint-placeholder-count="25"><div style="min-width: 0; {{cell.css}}"></div></sc-for>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{show3d}}" hint-placeholder-val="{{ false }}">
<div role="group" tabindex="0" aria-label="{{alt3d}}" onKeyDown="{{vp.key}}" style="position: absolute; inset: 36px 0 44px 0; display: grid; place-items: center; perspective: 140cqw; cursor: grab; touch-action: none">
<div style="position: relative; width: 72cqw; height: 72cqw; transform-style: preserve-3d; transform: {{scene.tf}}">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="40">
<div style="position: absolute; transform-style: preserve-3d; {{b.css}}">
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; {{b.front}}"></div>
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; filter: brightness(0.6); {{b.back}}"></div>
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; filter: brightness(0.8); {{b.right}}"></div>
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; filter: brightness(0.7); {{b.left}}"></div>
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; filter: brightness(1.15); {{b.top}}"></div>
<div style="position: absolute; backface-visibility: hidden; box-shadow: inset 0 0 0 0.3cqw rgba(0,0,0,0.22); background: {{b.c}}; filter: brightness(0.55); {{b.bottom}}"></div>
</div>
</sc-for>
</div>
</div>
</sc-if>
<div role="status" aria-live="polite" style="position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: center; pointer-events: none">
<sc-if value="{{showCopied}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); font-size: 13px; line-height: 1.4; color: var(--ink)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>
Copied to clipboard
</div>
</sc-if>
<sc-if value="{{showBlocked}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--danger); background: var(--surface); font-size: 13px; line-height: 1.4; color: var(--ink)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4M12 17h.01"></path></svg>
<span>Clipboard blocked. Use Download instead.</span>
</div>
</sc-if>
<sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; line-height: 1.4; color: var(--ink2)">Drag to rotate, scroll to zoom</div>
</sc-if>
</div>
<div style="position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; align-items: flex-end; justify-content: center">
<sc-if value="{{no3d}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 6px; padding: 0 8px 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; line-height: 1.4; color: var(--ink2)">
<span id="note3d">3D is available for Critter.</span>
<button type="button" class="link" onClick="{{tryCritter}}" style="min-height: 40px; padding: 0 4px; border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Try it</button>
</div>
</sc-if>
<sc-if value="{{show3d}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Viewing angle" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" class="chip" aria-pressed="{{p.on}}" onClick="{{p.set}}" style="{{p.chip}}">{{p.label}}</button>
</sc-for>
<button type="button" class="chip" onClick="{{zoomOut}}" aria-label="Zoom out" style="width: 34px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button type="button" class="chip" onClick="{{zoomIn}}" aria-label="Zoom in" style="width: 34px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
<button type="button" class="chip" onClick="{{resetView}}" style="border: 1px solid var(--line2)">Reset view</button>
</div>
</sc-if>
</div>

      closeMenu: () => this.setState({ menuOpen: false }),
      menuKey: (e) => { if (e.key === 'Escape' && menuOpen) this.setState({ menuOpen: false }); },
      pngItems: [512, 1024, 2048].map((n) => ({ label: 'PNG ' + n, dim: n + ' × ' + n })),
      copy: () => {
        this.setState({ toast: 'copied' });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ toast: 'none' }), 3000);
      },
      showCopied: toast === 'copied',
      showBlocked: toast === 'blocked',
      showHint: threeD && toast === 'none',
      // variations
      variants: [0, 1, 2, 3, 4, 5].map((i) => ({ label: 'Variation ' + (i + 1), av: this.build(cur.id, seedAt(i), hue, 'light'), pressed: i === variant, ring: ring(i === variant), pick: () => this.setState({ variant: i, noted: true }) })),
      noted,
      variantNote,
      useOriginal: () => this.setState({ variant: 0, noted: false }),
      // look controls
      autoOn: hue === null,
      autoCss: hue === null ? 'border: 2px solid var(--accent);' : 'border: 2px solid transparent;',
      pickAuto: () => this.setState({ colour: 'auto' }),
      swatches: this.hues().map((x) => {
        const on = x.id === colourId;
        return { name: x.name, on, bg: 'hsl(' + x.h + ' 62% 46%)', ink: x.h > 35 && x.h < 125 ? '#141414' : '#FFFFFF', ring: on ? 'border: 2px solid var(--accent);' : 'border: 2px solid transparent;', pick: () => this.setState({ colour: x.id }) };
      }),
      bgs: [['light', 'Light'], ['dark', 'Dark'], ['transparent', 'Transparent']].map((b) => ({ label: b[1], sw: b[0] === 'light' ? 'background: #F6F5F3;' : b[0] === 'dark' ? 'background: #14151A;' : 'background-color: #fff; background-image: conic-gradient(#CFCCC5 25%, transparent 0 50%, #CFCCC5 0 75%, transparent 0); background-size: 8px 8px;', on: bgMode === b[0], css: bgMode === b[0] ? segOn : segOff, pick: () => this.setState({ bg: b[0] }) })),
      styles: defs.map((s) => ({
        name: s.name,
        meta: s.n + '×' + s.n,
        aria: s.name + ' style' + (s.id === 'critter' ? ', 3D available' : ''),
        has3d: s.id === 'critter',
        av: this.build(s.id, key, hue, 'light'),
        pressed: s.id === cur.id,
        ring: ring(s.id === cur.id),
        pick: () => this.setState({ styleId: s.id, threeD: s.id === 'critter' ? this.flag('threeD') : false })
      }))
    };
  }
}
</script>
</body>
</html>
