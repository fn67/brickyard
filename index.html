<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pixel avatars for people who hate profile pictures." />
    <title>Brickyard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the saved app appearance before first paint so there is no flash of the wrong theme.
      try {
        var t = localStorage.getItem('brickyard-appearance');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
